name: Build STUCK (Windows VST3)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target STUCK_VST3 --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: STUCK-VST3-Windows
          path: build/STUCK_artefacts/Release/VST3/STUCK.vst3
